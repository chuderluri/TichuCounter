MaintainerNotes: |-
  Multi-module Gradle build (app + core + feature modules, convention plugins
  in build-logic/). Everything compiles with JDK 21; org.gradle.java.home
  pins the daemon to openjdk-21 (installed via sudo), the bytecode target is
  Java 17. There is no toolchain auto-download. Summary, description, icon,
  screenshots and changelog live in the app's own fastlane/metadata folder and
  are picked up from the tagged revision.

  Reproducible builds are enabled: the app is signed with the upstream release
  key (SHA-256 43ea...c008) and F-Droid verifies the rebuilt APK against the
  published one. If verification fails, the build is skipped rather than
  published. Nothing is signed in the repo, so a checkout without signing
  properties still produces the unsigned APK that F-Droid needs.

