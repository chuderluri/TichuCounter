MaintainerNotes: |-
  Multi-module Gradle build. The pure-JVM modules use a JDK 21 toolchain
  without auto-download, because the foojay resolver is rejected by the
  source scanner. Store text and images are scraped from fastlane/metadata
  at the tagged revision.

  Builds are verified against the published APK in Binaries, signed with the
  upstream release key listed in AllowedAPKSigningKeys.

  The icons are adapted from artwork by Res Brandenberger with written
  permission from Fata Morgana Verlag for non-commercial use, which is why
  NonFreeAssets is declared. See CREDITS.md.

