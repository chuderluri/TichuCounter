MaintainerNotes: |-
  Multi-module Gradle build (app + core + feature modules, convention plugins
  in build-logic/). Everything compiles with JDK 21, installed via sudo; the
  bytecode target is Java 17. There is no toolchain auto-download, so please
  keep openjdk-21 available. Summary, description, icon, screenshots and
  changelog live in the app's own fastlane/metadata folder and are picked up
  from the tagged revision. The release build is unsigned; F-Droid signs it.

