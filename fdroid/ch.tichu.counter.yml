AutoName: Tichu Counter
Summary: Scorekeeper for the card game Tichu
Description: |
  Tichu Counter replaces the paper score sheet for the card game Tichu.
  It tracks the running score of the two teams and records the outcome
  of every round.

  Organise your players in groups, compose two teams of two per game and
  swap players between rounds. Quick play starts an instant all-guest game
  and jumps straight into scoring. Enter the score with a calculator-style
  keypad (the other team's score is complemented to 100 automatically),
  record Small and Grand Tichu per player as made or lost, and double wins.
  Undo and redo every scoring action, even after restarting the app.
  Per-player statistics and fully offline operation.

