MaintainerNotes: |-
  Multi-module Gradle build (app + core + feature modules, convention plugins
  in build-logic/). The pure-JVM modules request a JDK 21 toolchain
  (jvmToolchain(21)); the buildserver image already provides JDK 21, so nothing
  is installed. The bytecode target is Java 17 and there is no toolchain
  auto-download, because F-Droid's source scanner rejects the foojay resolver.
  Summary, description, icon, screenshots and changelog live in the app's own
  fastlane/metadata folder and are picked up from the tagged revision.

  Reproducible builds are enabled: the app is signed with the upstream release
  key (SHA-256 43ea...c008) and F-Droid verifies the rebuilt APK against the
  published one, which is listed in Binaries. If verification fails, the build
  is skipped rather than published. Nothing is signed in the repo, so a checkout
  without signing properties still produces the unsigned APK that F-Droid needs.

  The launcher and store icons are adapted from artwork by Res Brandenberger,
  used with written permission from Fata Morgana Verlag for non-commercial use
  only. That artwork is not freely licensed, which is why the NonFreeAssets
  anti-feature is declared. See CREDITS.md in the source repository.

