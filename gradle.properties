org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# F-Droid rebuilds the release APK and compares it byte for byte with the
# published one. R8's DEX output can depend on the number of available worker
# threads, and the F-Droid buildserver has a different core count than this
# machine. ponytail: hypothesis, unverified - if the next F-Droid build still
# differs, revert both lines and work through F-Droid's reproducible-builds
# wiki instead.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
ksp.useKSP2=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
