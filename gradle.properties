org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# F-Droid rebuilds the release APK and compares it byte for byte with the
# published one. R8's DEX output is not the same for every configuration that
# shares a Gradle build-cache entry: the 0.6.7 reference came out of a cache hit
# with a different DEX than a fresh build. Measured 2026-10-14: fresh builds with
# a single worker are byte identical here and on the buildserver. Release APKs
# must be built without the build cache (see RELEASE.md and release-github.ps1).
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
ksp.useKSP2=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
